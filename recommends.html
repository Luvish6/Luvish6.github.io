<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luvish Recommends · Shows &amp; movies worth watching</title>
  <meta name="description" content="Shows and movies Luvish Ramchandani keeps coming back to: The Big Bang Theory, Suits, Brooklyn Nine-Nine, Stranger Things, Zodiac and more.">
  <link rel="canonical" href="https://luvish6.github.io/recommends.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611211528">
  <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <style>
    .rec-grid { display: grid; gap: 20px; margin-top: 28px; }
    @media (min-width: 760px) { .rec-grid { grid-template-columns: repeat(3, 1fr); } }
    .rec { display: flex; flex-direction: column; gap: 10px; }
    .rec .poster { height: 150px; border-radius: 10px; display: grid; place-items: center; font-size: 54px; margin-bottom: 4px; }
    .rec h2 { font-size: 22px; margin: 0; }
    .rec p { margin: 0; color: var(--muted); font-size: 15px; }
    .rec .meta { font: 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .rec[hidden] { display: none; }
    .lead + .filters { margin-top: 24px; }
    .rec .top { display: flex; gap: 8px; flex-wrap: wrap; }
    .soon { margin-top: 32px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="./" class="logo" aria-label="Back to home"><span class="knight">♞</span> Luvish</a>
      <a class="btn" href="./#beyond" style="margin-left:auto">← Back to the site</a>
    </div>
  </header>
  <main class="section">
    <div class="wrap">
      <p class="sq mono">Off the board</p>
      <h1 style="max-width:none">Luvish recommends</h1>
      <p class="lead">The shows and movies I keep coming back to. If you're looking for something to watch tonight, start here.</p>

      <div class="filters" role="group" aria-label="Filter recommendations">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="show">Shows</button>
        <button class="chip" data-f="movie">Movies</button>
      </div>
      <div class="rec-grid" id="recGrid"></div>
      <p class="soon">More recommendations coming soon. Got one for me? <a href="./#contact">Send it my way →</a></p>
    </div>
  </main>
  <footer class="footer"><div class="wrap">© Luvish Ramchandani · <a href="./">luvish6.github.io</a></div></footer>
  <script>
    const RECS = [
      { t: "The Big Bang Theory", k: "show", meta: "Sitcom · 12 seasons", e: "⚛️", g: "#f6d365,#fda085", fav: true, d: "Four brilliant, socially awkward scientists and the friends who put up with them. Endlessly rewatchable." },
      { t: "Brooklyn Nine-Nine", k: "show", meta: "Sitcom · 8 seasons", e: "🚔", g: "#f7971e,#ffd200", d: "A goofy but talented detective squad in a Brooklyn precinct. Fast jokes, great characters, and a lot of heart." },
      { t: "Suits", k: "show", meta: "Legal drama · 9 seasons", e: "💼", g: "#2c3e50,#4ca1af", d: "A college dropout with a photographic memory talks his way into a top law firm. Sharp dialogue and a lot of strategy, a bit like chess with briefcases." },
      { t: "The Mentalist", k: "show", meta: "Crime drama · 7 seasons", e: "🔍", g: "#8e2de2,#4a00e0", d: "A former fake psychic reads people to solve crimes. Great if you like noticing the small details everyone else misses." },
      { t: "Stranger Things", k: "show", meta: "Sci-fi horror · 5 seasons", e: "🚲", g: "#cb2d3e,#1a1a2e", d: "Kids on bikes, a secret lab and the Upside Down in 1980s Indiana. Nostalgic, creepy and very bingeable." },
      { t: "Cobra Kai", k: "show", meta: "Action drama · 6 seasons", e: "🥋", g: "#f12711,#f5af19", d: "The Karate Kid rivalry picks up 30+ years later. Surprisingly funny, with great fights and a lot of heart." },
      { t: "The Karate Kid", k: "movie", meta: "Film · 1984", e: "🥋", g: "#56ab2f,#a8e063", d: "Wax on, wax off. The classic underdog story that started it all. Watch it before Cobra Kai." },
      { t: "Zodiac", k: "movie", meta: "Crime thriller · 2007", e: "🕵️", g: "#232526,#414345", d: "David Fincher's slow-burn hunt for the Zodiac killer. An obsessive, detail-driven investigation that stays with you." },
      { t: "Batman films", k: "movie", meta: "Superhero · Film series", e: "🦇", g: "#0f2027,#2c5364", d: "From Gotham's darkest streets to the Joker's chaos, the Batman movies are some of the best superhero films ever made." },
      { t: "Marvel Cinematic Universe", k: "movie", meta: "Superhero · Film series", e: "🛡️", g: "#b21f1f,#fdbb2d", d: "Dozens of connected films building to Avengers: Endgame. The ultimate long-form crossover." },
      { t: "Vanilla Sky", k: "movie", meta: "Psychological thriller · 2001", e: "☁️", g: "#89f7fe,#66a6ff", d: "Tom Cruise in a dreamlike puzzle about love, guilt and what's real. The kind of film you keep thinking about afterwards." },
      { t: "Star Wars", k: "movie", meta: "Sci-fi saga · Film series", e: "⭐", g: "#000000,#434343", d: "A galaxy far, far away: Jedi, the Force and the greatest villain reveal in film history. Start with the original trilogy." },
      { t: "Harry Potter", k: "movie", meta: "Fantasy · 8 films", e: "⚡", g: "#4b1248,#f0c27b", d: "Eight films following the boy who lived from his first year at Hogwarts to the final battle. Pure comfort viewing." },
    ];
    const grid = document.getElementById("recGrid");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    grid.innerHTML = RECS.map(r => `
      <article class="card rec" data-k="${r.k}">
        <div class="poster" style="background:linear-gradient(135deg,${r.g})" aria-hidden="true">${r.e}</div>
        <div class="top"><span class="badge ${r.k === "movie" ? "idea" : "progress"}">${r.k === "movie" ? "Movie" : "Show"}</span>${r.fav ? '<span class="badge built">All-time favourite</span>' : ""}</div>
        <h2>${esc(r.t)}</h2>
        <span class="meta">${esc(r.meta)}</span>
        <p>${esc(r.d)}</p>
      </article>`).join("");
    document.querySelectorAll(".chip[data-f]").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll(".chip[data-f]").forEach(x => x.classList.toggle("active", x === c));
      grid.querySelectorAll(".rec").forEach(card => card.hidden = !(c.dataset.f === "all" || card.dataset.k === c.dataset.f));
    }));
  </script>
  <script>
    // count page views on the live site only
    if (!/^(localhost|127\.)/.test(location.hostname)) {
      var s = document.createElement('script'); s.async = true; s.src = 'https://gc.zgo.at/count.js';
      s.dataset.goatcounter = 'https://luvish.goatcounter.com/count'; document.head.appendChild(s);
    }
  </script>
</body>
</html>
