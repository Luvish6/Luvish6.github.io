<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Illegal move · Luvish</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <style>
    :root { --bg: #f7f4ee; --text: #1b1a17; --muted: #5f5a50; --accent: #b5770f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111214; --text: #ecebe7; --muted: #a29f97; --accent: #f2b134; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, sans-serif; text-align: center; padding: 16px; }
    .k { font-size: 96px; color: var(--accent); display: inline-block; animation: tip 2.4s ease-in-out infinite; }
    @keyframes tip { 50% { transform: rotate(-14deg) translateY(-6px); } }
    h1 { font: 700 40px Georgia, serif; margin: 8px 0; }
    p { color: var(--muted); max-width: 40ch; margin: 0 auto 24px; }
    a { display: inline-block; background: var(--accent); color: #fff; padding: 11px 20px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="k" aria-hidden="true">♞</div>
    <h1>404 · Illegal move</h1>
    <p>Even a knight can't jump to this square. The page you're looking for doesn't exist.</p>
    <a href="./">Back to the board</a>
  </main>
</body>
</html>
